  admitted_from: Add-API gate auto-publish, submission shieldlabs-b6a2bad8 at 16:05:29 UTC, confidence 90. A FIRST
    attempt 11 minutes earlier (shieldlabs-d19973c6, 15:54:05) carried the bare name with no URL, so the gate had
    nothing to research and parked it at confidence 2. That record was dropped as superseded, not as a rejection.
  slug: No rename needed — shieldlabs.ai already yields shieldlabs under the domain rule.
  host_health: shieldlabs.ai 200 / invented path 404. docs.shieldlabs.ai 200 / 404. api.shieldlabs.ai 404 on both,
    an API host with no root route. Checked with BOTH a default and a browser user-agent and the bytes are identical
    — unlike two providers profiled earlier today, ShieldLabs filters nobody.
  found_by_pipeline_not_by_my_probes: "My contract-discovery probes MISSED both of the following, and the enrichment\
    \ pipeline found them. Recorded because the probe list is what was wrong, not the provider.\n  OpenAPI  https://docs.shieldlabs.ai/references/openapi.yaml\
    \ — 200 text/yaml 18,115b, valid OpenAPI 3.1.0, \"ShieldLabs API\" v1.2, 3 paths, servers account.shieldlabs.ai/api\
    \ and api.shieldlabs.ai. I had probed /openapi.json and /openapi.yaml at the docs ROOT only.\n  MCP      https://docs.shieldlabs.ai/mcp\
    \ with a descriptor at /.well-known/mcp.json. An anonymous tools/list returns real tools over SSE. I had probed\
    \ /_mcp/server, the Mintlify path seen on another provider, and not /mcp."
  mcp_scope_note: The MCP server is REAL and unauthenticated, and it is a DOCUMENTATION server emitted by the Mintlify
    docs platform — not a ShieldLabs Server API server. Its tools search and read the docs corpus; none call the
    History or Management API, none identify a visitor, none return a Risk Score. An agent can learn how to integrate
    ShieldLabs through MCP but cannot transact with it. Recorded so the MCPServer pointer is not read as a transactional
    agent surface.
  two_llms_txt: Both shieldlabs.ai/llms.txt (9,660b) and docs.shieldlabs.ai/llms.txt (12,291b) are real text/plain.
    The submission recorded only the apex one.
  round_2026_09_04: 'Re-profiled under the local-v3 contract. THE CONTRACT MOVED UNDER US, WHICH IS THE FINDING
    OF THE ROUND. The provider changed its published OpenAPI three times between 2026-09-01 and 2026-09-03: it marked
    GET /v1/history deprecated and removed a per-row billing claim (and that path''s 402 response) on the 1st, stripped
    internal repository and Go type names from the spec and the webhook JSON Schema on the 2nd, and documented Sunset
    2027-01-01 with a named successor and RFC 8594 Deprecation/Sunset/Link headers on the 3rd. RFC 8594 conformance
    flipped false to true and a Deprecation pointer is now emitted; it was correctly absent before because the deprecation
    did not exist. All four OpenAPI documents were re-harvested and re-split from the current upstream, and three
    superseded pre-scrub copies were pruned from openapi/_original/ so a future re-split cannot resurrect the internal
    service names the provider deliberately removed.'
  round_2026_09_04_corrections: 'Four facts this catalog previously published about ShieldLabs were WRONG and are
    corrected, each against the provider''s own current words. The per-IP rate limit is 15 requests/minute, not
    20. The ban that follows is 10 minutes, not one hour. The History API is no longer exempt from rate limiting
    — it now carries a 15 requests/second per-site soft cap. And the deprecated Management History path does not
    bill per returned row; the provider''s DRIFT.md says plainly that "code does not debit". The first three corrections
    come from an August 2026 changelog entry that names the numbers it got wrong ("not 20/minute and not a 1-hour
    ban"), which is why this was a correction rather than a drift discovery. Three new limits were also published
    in that entry and are now recorded: per-domain ingest by plan (5/5/10/15 RPS), a domain freeze after 10 seconds
    at the cap, and a 40 RPS shared ingest cap.'
  round_2026_09_04_docs_contradiction: 'Observed first-hand, not read: the Errors page states 429 and 503 come from
    "REST ingest and network-check gateways only, not the Server API", while the Rate limits page states the Management
    API applies the same per-IP limit independently. During the well-known sweep on 2026-09-04, api.shieldlabs.ai
    and rest.shieldlabs.ai both returned 429 {"error":"too many requests"} to an unauthenticated probe. The Rate
    limits page is right and the Errors page understates the surface.'
  round_2026_09_04_well_known: 'The well-known manifest was rewritten from a bare documents[] list into the hosts[]
    -> documents[] shape the scorer actually reads, and widened from five hosts and five paths to eight hosts and
    sixteen paths. APIs.json, AAuth, UCP, ACP and oauth-protected-resource were probed here for the first time and
    all miss. A negative control was run per host: app.shieldlabs.ai FAILED it, answering 200 with the same 1,512-byte
    SPA shell for every path including one that cannot exist, so none of its 200s is counted and it earns no pointer
    credit. docs.shieldlabs.ai passed the control with a 404, so its two documents — the A2A agent card and the
    MCP descriptor — are real.'
  round_2026_09_04_provider_moved_agent_surface: 'Both agent-facing documents on the docs host changed and were
    re-saved verbatim. The A2A card''s advertised skill description was rewritten, and the provider-published Agent
    Skill itself was rewritten more substantially — it now opens with the situations that should trigger it rather
    than a feature list, and it adds an explicit negative boundary ("Do not use ShieldLabs for: authentication ...
    authorization ... or as a standalone blocker"). A skill that tells an agent when NOT to reach for it is rare
    and worth recording. The MCP server is byte-identical and still returns the same three documentation-scope tools
    to an anonymous tools/list; the scope note stands.'
  round_2026_09_04_sdk_decay: Every registry was re-probed and nothing has shipped — npm, PyPI, Packagist, RubyGems,
    crates.io and the Go proxy all still return nothing for the eight first-party libraries, and the tag count across
    all six SDK repositories is zero. Seven of the eight have had no commit since 2026-07-27, while the contract
    they wrap moved twice in the first week of September. The SDKs are now measurably behind the spec they are generated
    from, and because none is published a consumer cannot pin an older version either.
  round_2026_09_04_negatives: 'Re-verified absences, recorded so a later run does not re-credit them. No status
    page: shieldlabs.statuspage.io returns 200 but the subdomain is unclaimed and Atlassian serves its own Statuspage
    marketing page there (title "Real-Time Incident Communication with Statuspage | Atlassian"), status.shieldlabs.ai
    does not resolve. No trust center: trust.shieldlabs.ai does not resolve. No certifications, and the privacy
    page explicitly declines to make a compliance claim — so no Compliance pointer. No security.txt on any of eight
    hosts. No CLI (docs /cli 404, no CLI repository in the organization). No Postman collection. No roadmap page.
    No gRPC/Protobuf and no WSDL in the organization or on any host. No AsyncAPI. No OAuth, hence no scopes/ artifact.'
  round_2026_09_04_spec_divergence: ShieldLabs publishes the same OpenAPI at two public locations and they no longer
    match. The GitHub mirror still carries a stun_request_seen detection flag the docs copy has dropped, and the
    docs copy adds browser_vpn_proxy to the ConnectionType enum, which the mirror lacks. The docs copy is treated
    as canonical because the provider's own DRIFT.md names it upstream and calls the repository a mirror — which
    matters, because that same repository's README calls itself the "source of truth for generating the client SDKs".
