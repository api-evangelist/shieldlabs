name: ShieldLabs
description: >-
  Anonymous visitor identification and fraud-prevention platform. A browser JS snippet collects 100+ signals and returns
  a persistent visitor/device ID plus an explainable 0-100 risk score; the customer's own code makes the
  allow/challenge/block decision. Offers server-side REST APIs (History and Management), outbound webhooks, and
  agent-readable llms.txt documentation.
