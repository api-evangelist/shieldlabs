apis:
- name: ShieldLabs Server API
  description: 'Server-side REST API described by a public OpenAPI 3.1 specification (three operations
    plus one OpenAPI-3.1 webhook). Two hosts, implemented by two different internal services and diverging
    in casing, envelope, auth headers, billing and rate limiting: the History API on https://account.shieldlabs.ai/api
    (Private API Key, `Authorization: Bearer sec_…`, snake_case, `{data,total}` envelope with limit/offset,
    free — does not consume request balance) and the Management API on https://api.shieldlabs.ai (Secret
    Key plus an `X-Shield-Domain` header, PascalCase bare arrays, bills one request per returned row with
    a minimum of one). The primary delivery path is outbound: a signed identification.scored webhook carrying
    the Risk Score, the weighted signals, 18 detection flags and traffic-source attribution, delivered
    at most once with no retries and recovered through a free History read on request_id.'
