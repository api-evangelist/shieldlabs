domain_standard:
  market: fraud prevention / device intelligence / visitor identification
  standard_declared: none
  conforms: false
  reward_only_note: >-
    Checked and honestly empty. This market has no interoperability standard a contract can declare —
    there is no SCIM-, OData-, OpenRTB-, FHIR- or ISO-20022-equivalent for device fingerprinting and
    risk scoring, and no vendor-neutral risk-signal vocabulary that a competitor's client could
    consume unchanged. The nearest adjacent standards are advertising-side (IAB/TAG invalid-traffic
    taxonomies, which classify IVT rather than define an API) and identity-side (OpenID/FIDO, which
    concern authentication, a thing this product deliberately does not do). ShieldLabs' signal names,
    band labels (Clean/Low/Medium/High) and six identifier types are all first-party vocabulary, so
    swapping ShieldLabs for another vendor requires a bespoke connector.
  probed_for:
  - a declared risk-signal vocabulary or taxonomy URN in the spec
  - an IAB/TAG IVT classification mapping
  - a shared schema for device or visitor identifiers
  result: none present; nothing invented to fill the slot.
published_spec_divergence:
  note: >-
    ShieldLabs publishes the SAME OpenAPI at two public locations and, as of 2026-09-04, they do not
    match. The provider's own DRIFT.md names the docs copy as upstream and the GitHub copy as its
    mirror, so the docs copy is treated as canonical here and is what openapi/_original/ holds.
  canonical: https://docs.shieldlabs.ai/references/openapi.yaml
  mirror: https://raw.githubusercontent.com/ShieldLabs-ai/shieldlabs-openapi/main/openapi.yaml
  differences:
  - The mirror still carries a `stun_request_seen` detection flag that the canonical copy has removed.
  - The canonical copy adds `browser_vpn_proxy` to the ConnectionType enum; the mirror does not have it.
  consequence: >-
    An SDK generated from the GitHub repo — which the repo's README calls "source of truth for
    generating the client SDKs" — produces a different type than one generated from the docs. Both
    copies carry the 2026-09-03 deprecation, so the drift is in the webhook payload model only.
  observed: '2026-09-04'
