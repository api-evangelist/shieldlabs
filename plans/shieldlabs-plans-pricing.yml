note: >-
  Public, self-serve pricing with no sales gate. Billing is per identification (one visitor check),
  not per seat or per monthly active user. Both a monthly and a yearly rate are published; yearly
  saves 20%. Two price sets appear across the provider's own surfaces: the pricing page slider shows
  the yearly-billed monthly figure ($79 / $319 / $799 with the yearly per-identification rate) while
  the feature-comparison table and the site llms.txt show the monthly-billed rate ($99 / $399 / $999
  at $0.00396 / $0.00266 / $0.00199). Both are recorded below rather than picking one.

  Re-read 2026-09-04. Prices and included quotas are unchanged, but the Billing page now publishes
  three things it did not before, all of which are plan-scoped LIMITS rather than prices and all of
  which are recorded per tier below: how many domains a plan may keep active (1 / 1 / 3 / 5), the
  per-domain ingest ceiling on the gateway (5 / 5 / 10 / 15 requests per second), and a middle
  billing frequency — quarterly, at 10% off, between the monthly and yearly rates already recorded.
  Two facts were CORRECTED against the provider's own current documentation: the Custom-volume
  threshold is published as "above 1M" identifications per month, not above the Scale tier's 500,000;
  and Management API History lookups do NOT bill per returned record. The previous metering note said
  they did, which the provider now contradicts in both its billing page ("Free: history & profile")
  and its OpenAPI ("Does not consume request balance").
