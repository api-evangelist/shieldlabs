note: >-
  ShieldLabs maintains a first-party GitHub organization (github.com/ShieldLabs-ai, org blog
  https://shieldlabs.ai) holding eight client libraries plus an examples repo and the public OpenAPI
  repo. THE HEADLINE FINDING IS DISTRIBUTION, NOT CODE: not one of the eight libraries is published to
  any package registry. registry.npmjs.org returns 404 for @shieldlabs/js, @shieldlabs/react,
  @shieldlabs/vue, @shieldlabs/next and @shieldlabs/node; pypi.org returns 404 for shieldlabs;
  repo.packagist.org returns 404 for shieldlabs/shieldlabs; proxy.golang.org returns an empty version
  list for github.com/ShieldLabs-ai/shieldlabs-go. No repo carries a git tag or a GitHub release.
  Every version below is the string declared in the repo manifest, which is NOT a published version —
  a consumer cannot `npm install` or `pip install` any of these today. Do not read these as shipped
  SDKs. Separately, the docs themselves state there is no native SDK and show the raw ES-module
  snippet in every integration example, which is consistent with the registry evidence.
  The npm package @shieldlabs/cra-template-frontend (last published 2020-02-13) is a DIFFERENT
  organization and is deliberately excluded.
