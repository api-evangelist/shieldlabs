note: >-
  THE DEPRECATION POSTURE CHANGED MATERIALLY SINCE 2026-08-19 AND THIS IS THE HEADLINE OF THE ROUND.
  On 2026-09-01 the provider marked GET /v1/history on the Management API `deprecated: true` in its
  public OpenAPI, and on 2026-09-03 it added the sunset date. The operation now names its successor
  (searchHistoryAccount on account.shieldlabs.ai), carries a dated Sunset of 2027-01-01, and states
  that live responses emit `Deprecation`, `Sunset` and `Link: rel="successor-version"` headers. That
  is RFC 8594 behaviour declared in the contract itself, which the previous pass correctly recorded
  as absent — it did not exist yet.

  What is now published: machine-readable deprecation on the operation, a dated sunset, a named
  successor, and RFC 8594 response headers. What is STILL absent: a deprecation POLICY page stating
  how much notice any future deprecation gets, an SLA document, and a status page. The 99.9% figure
  remains a line item on the Scale tier of the pricing table with no terms, no credit schedule and no
  measurement definition behind it.

  On the status page specifically — do not re-credit shieldlabs.statuspage.io. It returns 200, but
  the subdomain is unclaimed and Atlassian serves its own Statuspage marketing page there. Verified
  again 2026-09-04: the page title is "Real-Time Incident Communication with Statuspage | Atlassian"
  and the canonical link points at atlassian.com. ShieldLabs operates no status page.
