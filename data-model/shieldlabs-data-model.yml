note: >-
  Entity graph derived from the OpenAPI $ref links and the identifier fields. The domain has an
  unusual shape for an API catalog entry: there are no CRUD resources and no writable objects. The
  whole model is one immutable observation — a scored visit — plus the six identifiers it is indexed
  by. The same observation is materialized in THREE different shapes depending on where it is read
  from, and the shapes do not share field names or casing.

  Re-derived 2026-09-04 against a re-harvested spec. Two model changes landed since the last pass:
  ConnectionType gained the value `browser_vpn_proxy` (a browser-extension VPN, previously only
  representable as a detection flag), and the whole Management-API materialization is now DEPRECATED
  with a sunset of 2027-01-01. That matters more than it looks: the PascalCase shape is one of the
  three materializations of this single entity, so a client that models Snapshot from the Management
  API is modelling a surface that is scheduled to disappear. The webhook and History API shapes are
  the two that survive.
entities:
- name: Snapshot (observation)
  description: One scored visit. Immutable, created by the snippet, never written by a client.
  materializations:
  - name: AccountSnapshot
    surface: History API (account.shieldlabs.ai)
    casing: snake_case
    key_fields: [request_id, session_id, cookie_id, device_id, visitor_id, ip, score, score_details, created_at]
    note: score_details is a JSON STRING that must be parsed again, not a nested array
  - name: Snapshot
    surface: Management API (api.shieldlabs.ai)
    casing: PascalCase
    key_fields: [RequestID, SessionID, CookieID, DeviceID, VisitorID, IP, ConnectionType, WebRtcHIP, OS, Browser, DeviceType, Country, UserHID, Score, Details, LastRequestTime]
    connection_type_enum: [direct, mobile, vpn, proxy, tor, privacy_relay, browser_vpn_proxy, unknown]
    deprecated: true
    sunset: '2027-01-01'
    successor: AccountSnapshot on the History API
    note: >-
      Details is a real array of ScoreDetail {Value, Description}. This materialization is served only
      by the deprecated searchHistoryV1 operation and disappears with it on 2027-01-01. New models
      should be built on AccountSnapshot or WebhookScoredData.
  - name: WebhookScoredData
    surface: outbound webhook
