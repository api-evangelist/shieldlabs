entries:
- date: '2026-08'
  title: Ingest limits, domain freeze, and History API soft cap
  breaking: false
  breaking_note: >-
    Not breaking as a contract change, but corrective as documentation: two limits an integrator may
    have coded against were published wrong before this entry.
  corrections:
  - Per-IP REST ingest is 15 requests per minute, not 20.
  - The per-IP ban is 10 minutes, not 1 hour.
  - Score 999 is only the sticky per-IP ban marker — soft 429s do not write it.
  - Active domains per plan are Free 1, Starter 1, Growth 3, Scale 5; domains already over the cap keep running and only new creates are refused.
  highlights:
  - >-
    Domain freeze — a domain sitting at its plan ingest cap for 10 seconds in a row has processing
    paused: same 429, no billing during the pause, no 999, and it is not a disabled domain. WebRTC
    for that domain pauses the same way.
  - >-
    History API soft rate limit — account.shieldlabs.ai now allows 15 requests per second per site,
    with a soft 429 and no ban, independent of the ingest limits. This surface was previously
    documented as not rate limited.
  - Per-domain REST ingest published per plan: 5 / 5 / 10 / 15 requests per second, soft 429, no domain ban.
  - Shared REST ingest cap published at 40 requests per second, soft 429.
  affects:
  - rate-limits/shieldlabs-rate-limits.yml
  - plans/shieldlabs-plans-pricing.yml
  source: https://docs.shieldlabs.ai/changelog
- date: '2026-06'
  title: Documentation rebuilt from the production codebase
  breaking: true
  breaking_note: >-
    Breaking for anyone who integrated against the previous docs: the documented score range and
    several documented features did not exist in the product.
  corrections:
  - The score is the Risk Score, 0-100. There is no "Trust Score" and no 0-999 scale.
  - There is no in-product rules engine; ShieldLabs returns a score and signals, the customer decides.
  - Only four band labels exist — Clean (0-9), Low (10-29), Medium (30-59), High (60-100). There is no "Bot" or "Banned" band.
  - The dashboard feature is the Patterns catalog, not "Behavior Patterns", and there is no "velocity" pattern.
  - 999 is an internal rate-limit sentinel, never a customer Risk Score.
  highlights:
  - Risk Score 0-100 with an explainable Details array of the signals that fired and their points.
  - Single signed webhook per identification; waits up to 60s for an optional follow-up network check, then always delivers.
  - At-most-once webhook delivery, keyed per endpoint with whsec_…; handlers must be idempotent on request_id.
  - 8 ready-made relationship Patterns surfaced on the dashboard as Suspicious or Dangerous.
  - Visitors and Traffic Sources analytics ranking each channel by anonymous-traffic share.
  - Server API documented — History API reads plus domain profile, with Authorization Bearer + X-Shield-Domain.
  - Six identifiers documented — DeviceID, VisitorID, CookieID, SessionID, RequestID, and the caller-supplied UserHID.
