note: >-
  A dated, human-readable changelog, now TWO entries deep. Still no feed and still no per-release
  version numbers, but it is no longer a one-off: an August 2026 section was added since the last
  pass and it is doing real work — it publishes three corrections to previously documented rate
  limits, in the form "not 20/minute and not a 1-hour ban". A provider that names the number it got
  wrong is rarer than one that keeps a changelog at all, and it is why rate-limits/ could be
  corrected this round from the provider's own words rather than from observed drift.

  Both entries are month-granular ("August 2026", "June 2026") rather than dated releases, so a
  consumer can see THAT something changed in a month but not on which day or against which version.
  There is still no history before June 2026.
