docs: https://docs.shieldlabs.ai/setup/keys
note: >-
  Derived from the provider's OpenAPI securitySchemes, then upgraded from the published keys reference.
  ShieldLabs issues four distinct credentials per registered domain; only two of them appear in the
  OpenAPI (the two Server API bearer schemes). The public key and the per-endpoint webhook signing
  secret are documented but are not OpenAPI security schemes, so they are recorded separately below.

  Re-derived 2026-09-04 from a re-harvested spec. The two schemes, their names, their transport and
  their per-domain scoping are unchanged. One thing was added: the provider's own OpenAPI repository
  README states that LEGACY PATH AUTHENTICATION on the Management API is deprecated with a sunset of
  2027-01-01 — the same date as the deprecated History operation. That deprecation is published only
  in the repository README; it does not appear on the docs site or in the spec, so a consumer reading
  the documentation alone will not see it. Recorded below.

  There is still no OAuth and no OpenID Connect on any surface, which is why this repo carries no
  scopes/ artifact: with two static bearer credentials and no authorization server there is no scope
  surface to record. /.well-known/oauth-authorization-server and /.well-known/oauth-protected-resource
  return 404 on all eight hosts.
summary:
  types:
  - http
  api_key_in: []
  oauth2_flows: []
  scheme_count: 2
  oauth2: false
  openid_connect: false
  mutual_tls: false
schemes:
- name: PrivateApiKey
  type: http
  scheme: bearer
  description: >-
    Private API Key from the dashboard API tab, format `sec_xxx-xxx-xxx`. Sent as
    `Authorization: Bearer sec_…` to the History API on account.shieldlabs.ai. Free reads —
    does not consume request balance.
  applies_to: https://account.shieldlabs.ai/api
  sources:
