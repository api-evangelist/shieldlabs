  detail: >-
    Empty body. Check the Server API credential (Authorization: Bearer) or ?publicKey= on the
    snippet, and that the domain is enabled.
  remediation: Verify the key and the domain status in the dashboard.
  source_operation: openapi/_original/shieldlabs-openapi.yaml#searchHistoryAccount
- status: 402
  title: Out of requests
  detail: >-
    Empty body. The domain's request balance is exhausted. Raised by NEW identifications (snippet
    ingest). History API and profile reads do not consume balance and do not return 402. The
    deprecated Management History path no longer carries a 402 response in the spec at all — it was
    removed on 2026-09-01 along with the per-row billing claim.
  remediation: Top up or upgrade the plan.
  changed_since: >-
    Previously recorded as "the Management API History path bills one request per returned row (a
    zero-row lookup still bills one)". The provider removed that behaviour and the 402 response from
    the operation; do not reinstate it.
  source_operation: openapi/_original/shieldlabs-openapi.yaml#searchHistoryV1
- status: 404
  title: Unsupported history type
  detail: >-
    Server API only. Body is a bare JSON string. A SUPPORTED type that matches no records returns 200
    with an empty array, not 404.
  supported_types: [ip, user_hid, visitor_id, request_id, device_id, session_id, cookie_id]
  remediation: Use a supported identifier type.
  note: >-
    A supported type matching no records returns 200 with an empty list, not 404 — and, since
    2026-09-01, does not bill.
  source_operation: openapi/_original/shieldlabs-openapi.yaml#searchHistoryV1
- status: 429
  title: Rate-limited
  detail: >-
    Body is {"error": "too many requests"}. Crossing 15 requests/minute from one IP bans that IP for
    10 minutes. Also raised — WITHOUT a ban — by the per-domain plan ingest cap, the 40/s shared
    ingest cap, a domain freeze, and the History API's 15 req/s per-site soft cap. All five are the
    same 429 with the same body; nothing in the response distinguishes them.
  surfaces:
  - rest.shieldlabs.ai (ingest + network check)
  - api.shieldlabs.ai (Management API, per-IP limit applied independently)
  - account.shieldlabs.ai (History API soft cap)
  docs_contradiction: >-
    The Errors page says 429 is raised by "REST ingest and network-check gateways only, not the
    Server API". This is contradicted by the Rate limits page and by direct observation — a 429 with
    this exact body was returned by api.shieldlabs.ai and rest.shieldlabs.ai to an unauthenticated
    probe on 2026-09-04. Handle 429 on every surface.
  remediation: >-
    Back off; do not proxy snippet traffic through one server IP. There is no Retry-After header, so
    a client cannot tell a one-second soft reject from a ten-minute ban and must assume the longer.
  cross_reference: rate-limits/shieldlabs-rate-limits.yml
  source_operation: openapi/_original/shieldlabs-openapi.yaml#searchHistoryV1
- status: 500
  title: Internal error
  detail: Transient.
  remediation: Retry with backoff.
- status: 503
  title: Server busy
  detail: >-
    Body is {"error": "server is busy"}. The 512-connection concurrency cap was hit. The Errors page
    scopes this to the ingest gateways, but the Rate limits page states the Management API applies
    the same 512 in-flight cap independently.
  remediation: Retry with a short jittered backoff.
  source_operation: openapi/_original/shieldlabs-openapi.yaml#searchHistoryV1
traps:
- name: 999 rate-limit sentinel
  detail: >-
    A rate-limit ban writes a score of 999 to the snapshot. It is not capped to 100 and can reach a
    webhook handler or a History row. Guard for score > 100 before reading the risk band, otherwise a
    gateway ban is read as a maximum-risk visitor.
- name: one 429, five causes, no header to tell them apart
  detail: >-
    Five different limits return an identical 429 with an identical body. One of them (the per-IP
    limit) starts a sticky ten-minute ban; the other four clear in about a second. No Retry-After,
    no RateLimit-* header, and no distinguishing body field is published, so a client that backs off
    for a second on a ban keeps hammering a banned IP, and a client that backs off for ten minutes on
    a soft reject stalls needlessly.
  cross_reference: rate-limits/shieldlabs-rate-limits.yml
- name: the Errors page understates where 429 and 503 occur
  detail: >-
    It scopes both to the ingest gateways. Both occur on the Server API hosts as well, per the Rate
    limits page and per direct observation on 2026-09-04.
