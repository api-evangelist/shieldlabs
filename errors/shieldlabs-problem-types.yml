format: none
note: >-
  ShieldLabs does NOT use RFC 9457 problem+json, and does not use one error envelope at all. The docs
  say so explicitly: "Error bodies are not uniform, so branch on the HTTP status code, not on a body
  field." Three different shapes are in play across the surfaces — a {"error": "..."} object from the
  ingest and network-check gateways, an EMPTY body from the Server API on 401 and 402, and a BARE JSON
  STRING (e.g. "request_id is not supported") from the Server API on 400 and 404. There are no
  machine-readable error codes anywhere: the status code is the only stable, parseable signal.

  THE PROVIDER'S TWO PAGES DISAGREE ABOUT 429, AND WE CAN SETTLE IT. The Errors page states that 429
  and 503 come from "REST ingest and network-check gateways only, not the Server API". The Rate
  limits page, rewritten in August 2026, states the opposite twice: the Management API "applies the
  same per-IP limit (15/min, 10-minute ban) and concurrency cap (512 in-flight) independently", and
  the History API has its own soft cap of 15 requests/second per site returning 429. The rate-limits
  page is the correct one: while probing /.well-known paths on 2026-09-04 we received
  `429 {"error":"too many requests"}` directly from api.shieldlabs.ai and rest.shieldlabs.ai, with no
  credentials and no ingest traffic. A client that trusts the Errors page will not handle a 429 on
  the Server API, and will get one.

  Three details in this file were corrected on 2026-09-04 against the provider's own current
  documentation — the per-IP threshold (15/min, not 20), the ban length (10 minutes, not one hour),
  and per-row billing on the deprecated Management History path, which the provider now says does not
  happen at all.
